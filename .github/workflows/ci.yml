
name: AI Data Agent CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-data-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Placeholder for tests that initialize the Groq client.
    # Never put your real API key here.
    env:
      GROQ_API_KEY: ci-placeholder-not-a-real-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated test suite
        run: python -m pytest -v

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build FastAPI backend image
        run: |
          docker build --pull \
            --file Dockerfile.backend \
            --tag ai-data-agent-backend:ci .

      - name: Build Streamlit frontend image
        run: |
          docker build --pull \
            --file Dockerfile.frontend \
            --tag ai-data-agent-frontend:ci .
